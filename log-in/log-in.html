<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Login</title> 
        <link rel="stylesheet" href="log-in.css"> 
        <!-- Font Awesome --> 
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/6.5.2/css/all.min.css"> 
    </head> 
    <body> 
    <div class="login-wrapper"> 
        <!-- ========================= 
        LEFT SIDE - BRANDING 
        ========================= --> 
        <div class="login-brand"> 
            <div class="brand-content"> 
        <!-- Logo --> 
        <div class="logo"> 
        <img src="../image/placeholder.png" alt="Web Application Logo">
        </div>
        <h1>Web Application</h1>
        <p>Welcome back! Please login to continue.</p>
    </div>
    <!-- ========================= 
    RIGHT SIDE - LOGIN FORM 
    ========================= -->
    <div class="login-form-section">
        <div class="login-container">
            <h2>Login</h2>
            <p class="login-subtittle">Sign in to your account</p>
            <form id="loginForm">
                <!-- Email -->
                <div class="form-group">
                    <label="Email">Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter email">
                    <span id="loginEmailError" class="error"></span>
                </div>
                <!-- Password -->
                <div class="form-group">
                    <label="password">Password</label>
                    <div class="password-container">
                        <input type="password" id="loginPassword" placeholder="Enter password">
                        <i class="fa-solid fa-eye" id="toggleLoginPassword"></i>
                    </div>
                    <span id="loginPasswordError" class="error"></span>
                </div>
                <!-- Login Button -->
                <button type="submit" class="login-button">Login</button>
                <!-- Sign Up -->
                <div class="signup-link">
                    <span>Don't have an account?</span> <a href="../sign-up/sign-up.html">Sign up</a>
                </div>
                <!-- Login Message-->
                <p id="loginMessage"></p>
            </form>
        </div>
    </div>
    <script type="module" src="log-in.js"></script>
    </body>
</html>
